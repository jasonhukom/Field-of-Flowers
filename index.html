<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>🌼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scene" aria-hidden="true">
    <div class="sun"></div>
    <div class="hill a"></div>
    <div class="hill b"></div>
    <div class="ground"></div>
  </div>

  <!-- flowers grow here; tap or drag anywhere on the grass to plant more -->
  <main id="field" class="field" aria-hidden="true"></main>

  <button id="reset" class="reset" type="button" aria-label="New field">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
