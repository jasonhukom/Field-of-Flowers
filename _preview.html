<!doctype html><meta charset="utf-8"><title>preview</title>
<style>body{margin:0;background:#222;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
div{position:relative;aspect-ratio:16/9;overflow:hidden}svg{width:100%;height:100%;display:block}
span{position:absolute;left:6px;top:4px;color:#fff;font:700 13px sans-serif;background:#0008;padding:2px 6px;border-radius:4px}</style>
<body><script src="scenes.js"></script><script>
var q=new URLSearchParams(location.search), a=+q.get('from')||0, b=+q.get('to')||20;
for(var i=a;i<b;i++){var s=Scenes.get(i),d=document.createElement('div');d.innerHTML=s.svg+'<span>'+(i+1)+' '+s.name+'</span>';document.body.appendChild(d);}
</script>
